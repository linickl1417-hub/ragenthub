<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAGentHub — Enterprise RAG Platform</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; color: #2b6cb0; }
  .header .badges { font-size: 12px; color: #718096; }

  /* Layout */
  .container { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 280px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; }
  .sidebar-section { padding: 16px; border-bottom: 1px solid #f0f0f0; }
  .sidebar-section h3 { font-size: 12px; color: #718096; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
  .domain-list { display: flex; flex-direction: column; gap: 4px; }
  .domain-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .domain-item:hover { background: #f7fafc; }
  .domain-item.active { background: #ebf8ff; color: #2b6cb0; font-weight: 600; }
  .domain-item .count { font-size: 11px; color: #a0aec0; }

  /* Main area */
  .main { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; }

  /* Chat area */
  .chat-header { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e8e8e8; }
  .chat-header h2 { font-size: 16px; }
  .chat-header .sub { font-size: 12px; color: #718096; margin-top: 2px; }

  .chat-messages { flex: 1; overflow-y: auto; padding: 24px; }
  .message { max-width: 70%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
  .message.user { background: #2b6cb0; color: #fff; margin-left: auto; }
  .message.assistant { background: #fff; color: #222; }
  .message .meta { font-size: 11px; color: #a0aec0; margin-top: 8px; }
  .message.citations { margin-top: 8px; padding: 8px; background: #f7fafc; border-radius: 6px; font-size: 12px; }
  .message.reflection { margin-top: 8px; padding: 8px; background: #fffff0; border: 1px dashed #ecc94b; border-radius: 6px; font-size: 12px; color: #975a16; }

  /* Input area */
  .chat-input { background: #fff; padding: 16px 24px; border-top: 1px solid #e8e8e8; display: flex; gap: 12px; }
  .chat-input textarea { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; resize: none; height: 44px; }
  .chat-input button { padding: 0 24px; background: #2b6cb0; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .chat-input button:disabled { background: #a0aec0; cursor: not-allowed; }

  /* Modal */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 400px; }
  .modal h3 { margin-bottom: 16px; }
  .modal .form-group { margin-bottom: 12px; }
  .modal label { font-size: 13px; color: #4a5568; display: block; margin-bottom: 4px; }
  .modal input, .modal textarea { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; }
  .btn-primary { background: #2b6cb0; color: #fff; }
  .btn-secondary { background: #e2e8f0; color: #4a5568; }

  /* Upload */
  .upload-area { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 20px; text-align: center; color: #718096; font-size: 13px; cursor: pointer; margin-top: 8px; }
  .upload-area:hover { border-color: #2b6cb0; color: #2b6cb0; }

  /* Toast */
  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 200; }
  .toast.success { background: #38a169; }
  .toast.error { background: #e53e3e; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <h1>RAGentHub</h1>
  <div class="badges">4-Agent Pipeline · Reflection Loop · Multi-Domain Reskinning</div>
</div>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Domains</h3>
      <div class="domain-list" id="domainList"></div>
      <button onclick="showCreateDomain()" style="margin-top: 8px; width: 100%; padding: 6px; background: #f7fafc; border: 1px dashed #cbd5e0; border-radius: 6px; cursor: pointer; font-size: 12px; color: #718096;">+ New Domain</button>
    </div>

    <div class="sidebar-section">
      <h3>Documents</h3>
      <div id="docList"></div>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        📄 Upload Document
        <input type="file" id="fileInput" accept=".md,.txt,.pdf" style="display:none" onchange="uploadFile(this)">
      </div>
    </div>

    <div class="sidebar-section">
      <h3>History</h3>
      <div id="historyList" style="font-size: 12px; color: #718096;">No history yet</div>
    </div>

    <div class="sidebar-section">
      <h3>Access</h3>
      <div style="font-size:12px;color:#718096;margin-bottom:6px;">
        API key <span id="keyState"></span>
      </div>
      <button onclick="promptApiKey()" style="width:100%;padding:6px;background:#f7fafc;border:1px dashed #cbd5e0;border-radius:6px;cursor:pointer;font-size:12px;color:#4a5568;">Set API key</button>
    </div>
  </div>

  <!-- Main chat area -->
  <div class="main">
    <div class="chat-header">
      <h2 id="chatTitle">Medical Domain</h2>
      <div class="sub">Ask questions about the knowledge base</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <textarea id="questionInput" placeholder="Type your question... (Press Enter to send)"></textarea>
      <button id="sendBtn" onclick="sendQuestion()">Send</button>
    </div>
  </div>
</div>

<!-- Create Domain Modal -->
<div class="modal-overlay hidden" id="createDomainModal">
  <div class="modal">
    <h3>Create New Domain</h3>
    <div class="form-group">
      <label>Domain ID (e.g. legal, retail)</label>
      <input type="text" id="newDomainId" placeholder="legal">
    </div>
    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="newDomainName" placeholder="Legal Department">
    </div>
    <div class="form-group">
      <label>System Prompt</label>
      <textarea id="newDomainPrompt" rows="3" placeholder="You are a support agent for..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideCreateDomain()">Cancel</button>
      <button class="btn-primary" onclick="createDomain()">Create</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
let currentDomain = 'medical';
let currentUserId = 'web-user';
let allDomains = {};
let apiKey = localStorage.getItem('ragenthub_api_key') || '';

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => HTML_ESCAPES[ch]);
}

function renderKeyState() {
  const el = document.getElementById('keyState');
  if (el) el.textContent = apiKey ? '(configured)' : '(not set)';
}

function promptApiKey() {
  const entered = window.prompt('API key required by this service (leave empty to clear):', apiKey);
  if (entered === null) return;
  apiKey = entered.trim();
  if (apiKey) localStorage.setItem('ragenthub_api_key', apiKey);
  else localStorage.removeItem('ragenthub_api_key');
  renderKeyState();
  loadDomains();
}

async function request(url, options = {}, allowRetry = true) {
  const headers = new Headers(options.headers || {});
  if (apiKey) headers.set('X-API-Key', apiKey);

  const res = await fetch(url, { ...options, headers });

  if (res.status === 401 && allowRetry) {
    const entered = window.prompt('This API requires an API key:');
    if (entered && entered.trim()) {
      apiKey = entered.trim();
      localStorage.setItem('ragenthub_api_key', apiKey);
      renderKeyState();
      return request(url, options, false);
    }
  }

  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try {
      const body = await res.json();
      if (body && body.detail) {
        detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
      }
    } catch (_) { /* non-JSON error body */ }
    throw new Error(detail);
  }
  return res.json();
}

async function init() {
  renderKeyState();
  await loadDomains();
  await loadChatHistory();
  await Promise.all([loadDocs(), loadRecentAudits()]);
}

/* ---------- Domains ---------- */
async function loadDomains() {
  try {
    const data = await request(`${API}/api/v1/domains`);
    allDomains = {};
    data.forEach(d => { allDomains[d.id] = { name: d.name, isCustom: d.is_custom }; });
  } catch (e) {
    allDomains = { medical: { name: 'Medical' } };
    showToast('Could not load domains: ' + e.message, 'error');
  }
  renderDomains();
}

function renderDomains() {
  document.getElementById('domainList').innerHTML = Object.entries(allDomains).map(([id, d]) => {
    const active = id === currentDomain ? 'active' : '';
    const badge = d.isCustom ? '<span class="count">custom</span>' : '';
    return `<div class="domain-item ${active}" onclick="switchDomain('${escapeHtml(id)}')">
      <span>${escapeHtml(d.name)}</span>${badge}
    </div>`;
  }).join('');
}

function switchDomain(id) {
  currentDomain = id;
  document.getElementById('chatTitle').textContent = (allDomains[id]?.name || id) + ' Domain';
  renderDomains();
  loadChatHistory();
  loadDocs();
}

/* ---------- Chat ---------- */
async function loadChatHistory() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '<div style="text-align:center;color:#a0aec0;margin-top:80px;">Loading history…</div>';
  try {
    const msgs = await request(
      `${API}/api/v1/chat/history?user_id=${encodeURIComponent(currentUserId)}&domain=${encodeURIComponent(currentDomain)}`
    );
    renderMessages(msgs);
  } catch (e) {
    container.innerHTML = `<div style="text-align:center;color:#a0aec0;margin-top:80px;">Ask a question to start the conversation</div>`;
  }
}

function renderMessages(msgs) {
  const container = document.getElementById('chatMessages');
  if (!msgs || msgs.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#a0aec0;margin-top:80px;">Ask a question to start the conversation</div>';
    return;
  }
  container.innerHTML = msgs.map(m => messageHtml(m)).join('');
  container.scrollTop = container.scrollHeight;
}

function messageHtml(m) {
  const role = m.role === 'user' ? 'user' : 'assistant';
  let citationsHtml = '';
  try {
    const refs = typeof m.citations === 'string' ? JSON.parse(m.citations || '[]') : (m.citations || []);
    if (refs.length) {
      citationsHtml = `<div class="citations">📚 ${refs.map(c => escapeHtml(c.source)).join(', ')}</div>`;
    }
  } catch (_) { /* ignore malformed payload */ }
  const reflectionHtml = (m.reflection_rounds || 0) > 0
    ? `<div class="reflection">🔄 Reflection loop triggered (round ${m.reflection_rounds})</div>` : '';
  const contextHtml = (m.context_turns || 0) > 0
    ? `<div class="reflection">🧠 Using ${m.context_turns} previous turn(s)</div>` : '';
  const time = m.created_at ? new Date(m.created_at).toLocaleTimeString() : '';
  return `<div class="message ${role}">${escapeHtml(m.content)}${citationsHtml}${reflectionHtml}${contextHtml}<div class="meta">${escapeHtml(time)}</div></div>`;
}

async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';

  const container = document.getElementById('chatMessages');
  container.insertAdjacentHTML('beforeend', messageHtml({ role: 'user', content: question }));
  container.scrollTop = container.scrollHeight;

  try {
    const data = await request(`${API}/api/v1/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, domain: currentDomain, user_id: currentUserId })
    });
    container.insertAdjacentHTML('beforeend', messageHtml({
      role: 'assistant',
      content: data.answer,
      citations: JSON.stringify(data.citations || []),
      reflection_rounds: data.agent_trace?.reflection_rounds || 0,
      context_turns: data.agent_trace?.context_turns || 0,
    }));
    container.scrollTop = container.scrollHeight;
    loadRecentAudits();
  } catch (e) {
    container.insertAdjacentHTML('beforeend', `<div class="message assistant" style="color:#c53030;">Failed: ${escapeHtml(e.message)}</div>`);
    container.scrollTop = container.scrollHeight;
  } finally {
    btn.disabled = false;
  }
}

/* ---------- Recent activity ---------- */
async function loadRecentAudits() {
  const box = document.getElementById('historyList');
  try {
    const rows = await request(`${API}/api/v1/audit/recent?limit=10`);
    if (!rows.length) {
      box.innerHTML = '<span style="color:#a0aec0;">No history yet</span>';
      return;
    }
    box.innerHTML = rows.map(r => `
      <div style="padding:6px 0;border-bottom:1px solid #f0f0f0;">
        <div style="color:#2d3748;">${escapeHtml(r.question).slice(0, 40)}</div>
        <div style="color:#a0aec0;font-size:11px;">${escapeHtml(r.domain)} · ${r.latency_ms}ms · ${escapeHtml(r.guard_action)}</div>
      </div>
    `).join('');
  } catch (e) {
    box.innerHTML = '<span style="color:#c53030;">Failed to load</span>';
  }
}

/* ---------- Documents ---------- */
async function loadDocs() {
  const box = document.getElementById('docList');
  try {
    const docs = await request(`${API}/api/v1/documents?domain=${encodeURIComponent(currentDomain)}`);
    if (!docs.length) {
      box.innerHTML = '<span style="color:#a0aec0;font-size:12px;">No documents yet</span>';
      return;
    }
    box.innerHTML = docs.map(d => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;gap:6px;">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(d.filename)}">
          📄 ${escapeHtml(d.filename)} <span style="color:#a0aec0;">(${d.chunk_count})</span>
        </span>
        <button onclick="deleteDoc('${escapeHtml(d.filename)}')"
          style="border:none;background:none;color:#e53e3e;cursor:pointer;font-size:11px;">delete</button>
      </div>
    `).join('');
  } catch (e) {
    box.innerHTML = `<span style="color:#c53030;font-size:12px;">Failed to load: ${escapeHtml(e.message)}</span>`;
  }
}

async function deleteDoc(filename) {
  if (!confirm(`Delete "${filename}" from ${currentDomain}? This removes its vectors too.`)) return;
  try {
    await request(
      `${API}/api/v1/documents/${encodeURIComponent(filename)}?domain=${encodeURIComponent(currentDomain)}`,
      { method: 'DELETE' }
    );
    showToast('Document deleted', 'success');
    loadDocs();
  } catch (e) {
    showToast('Delete failed: ' + e.message, 'error');
  }
}

async function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('domain', currentDomain);

  showToast('Uploading ' + file.name + '…', 'success');
  try {
    const res = await request(`${API}/api/v1/documents`, { method: 'POST', body: formData });
    showToast(`Ingested ${res.file} (${res.chunks} chunks)`, 'success');
    loadDocs();
  } catch (e) {
    showToast('Upload failed: ' + e.message, 'error');
  } finally {
    input.value = '';
  }
}

/* ---------- Create domain ---------- */
function showCreateDomain() {
  document.getElementById('createDomainModal').classList.remove('hidden');
}

function hideCreateDomain() {
  document.getElementById('createDomainModal').classList.add('hidden');
}

async function createDomain() {
  const id = document.getElementById('newDomainId').value.trim().toLowerCase();
  const name = document.getElementById('newDomainName').value.trim();
  const prompt = document.getElementById('newDomainPrompt').value.trim();

  if (!id || !name) {
    showToast('Domain ID and display name are required', 'error');
    return;
  }

  try {
    await request(`${API}/api/v1/domains`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name, system_prompt: prompt || 'You are a helpful assistant.', deny_topics: [] })
    });
    await loadDomains();
    hideCreateDomain();
    showToast('Domain created', 'success');
    switchDomain(id);
  } catch (e) {
    showToast('Create failed: ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

document.getElementById('questionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});

init();
</script>

</body>
</html>
