<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>RAGentHub Demo</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; background: #f7f8fa; color: #222; }
  h1 { color: #2b6cb0; margin-bottom: 4px; }
  .sub { color: #718096; margin-top: 0; font-size: 13px; }
  .row { margin: 12px 0; }
  label { font-size: 13px; color: #4a5568; }
  select, input, textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
  button { background: #2b6cb0; color: #fff; border: 0; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #a0aec0; }
  #answer { white-space: pre-wrap; background: #fff; padding: 16px; border-radius: 6px; margin-top: 16px; border: 1px solid #e2e8f0; line-height: 1.6; }
  #citations { margin-top: 12px; background: #ebf8ff; border-left: 3px solid #2b6cb0; padding: 10px 14px; border-radius: 4px; font-size: 13px; }
  #citations .src { color: #2b6cb0; font-weight: 600; }
  #trace { font-size: 12px; color: #718096; margin-top: 10px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 6px; }
  .badge.pass { background: #c6f6d5; color: #22543d; }
  .badge.denied { background: #fed7d7; color: #742a2a; }
</style>
</head>
<body>
  <h1>RAGentHub 演示台</h1>
  <p class="sub">Retriever → Guardian → Generator → Auditor 四智能体 RAG 链路</p>

  <div class="row">
    <label>行业 domain</label>
    <select id="domain">
      <option value="medical">medical（医学文献）</option>
      <option value="finance">finance（金融合规）</option>
      <option value="gov">gov（政务办事）</option>
    </select>
  </div>
  <div class="row">
    <label>问题</label>
    <textarea id="q" rows="3">PCLT20K 数据集用于什么任务？</textarea>
  </div>
  <div class="row"><button id="btn" onclick="ask()">提问</button></div>

  <div id="answer" style="display:none"></div>
  <div id="citations" style="display:none"></div>
  <div id="trace"></div>

<script>
const API = 'http://localhost:8000';

async function ask() {
  const domain = document.getElementById('domain').value;
  const q = document.getElementById('q').value.trim();
  if (!q) return;

  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '思考中…';

  const box = document.getElementById('answer');
  const cit = document.getElementById('citations');
  box.style.display = 'block'; box.textContent = '思考中…';
  cit.style.display = 'none';

  try {
    const r = await fetch(API + '/api/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, domain, user_id: 'web-demo' })
    });
    const data = await r.json();
    box.textContent = data.answer;

    if (data.citations && data.citations.length) {
      cit.style.display = 'block';
      cit.innerHTML = '<b>引用来源</b>：' + data.citations.map(c =>
        `<div class="src">${c.source} <span style="color:#718096;font-weight:normal">相似度 ${c.score}</span></div>`
      ).join('');
    }

    const ga = data.agent_trace.guard_action;
    document.getElementById('trace').innerHTML =
      `<span class="badge ${ga === 'pass' ? 'pass' : 'denied'}">guard: ${ga}</span>` +
      `耗时 ${data.latency_ms}ms · 检索 ${data.agent_trace.retrieved} 条 · ` +
      `llm=${data.agent_trace.llm_provider} · audit#${data.audit_id}`;
  } catch (e) {
    box.textContent = '请求失败：' + e.message + '\n请确认 Python 服务在 8000 端口运行。';
  } finally {
    btn.disabled = false; btn.textContent = '提问';
  }
}
</script>
</body>
</html>
