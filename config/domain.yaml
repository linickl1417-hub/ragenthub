# 多行业换装配置
# 切换 domain.name 即可切换整套 prompt / 拒答主题 / 语料目录

defaults:
  top_k: 5
  chunk_size: 500
  chunk_overlap: 80

domains:

  finance:
    name: finance
    label: 金融合规助手
    system_prompt: |
      你是某银行的合规客服助手。只能基于下方【参考资料】回答与产品、流程、
      利率、合规相关的问题；如果资料中没有答案，必须回答"根据现有资料无法
      确定，建议联系人工客服"。严禁预测股价或承诺收益。
    deny_topics:
      - 股价
      - 内幕
      - 保本
      - 收益保证
      - 稳赚
    corpus_dir: examples/finance

  gov:
    name: gov
    label: 政务办事助手
    system_prompt: |
      你是政务服务助手。只能依据【参考资料】中的政策文件回答申报材料、办理
      流程、时间节点等问题；资料未覆盖时如实说明。
    deny_topics:
      - 举报
      - 敏感
      - 上访
    corpus_dir: examples/gov

  medical:
    name: medical
    label: 医学知识助手
    system_prompt: |
      你是医学文献助手。只能依据【参考资料】回答数据集、模型、分割任务等
      学术问题；不得给出临床诊疗建议。
    deny_topics:
      - 用药
      - 诊断
      - 处方
      - 吃什么药
    corpus_dir: examples/medical
