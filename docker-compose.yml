# RAGentHub 一键部署：
#   docker compose up -d                  # 核心服务（PG + Redis + AI + Java + Web）
#   docker compose --profile kafka up -d  # 额外起 Kafka
#
# 访问：
#   ai-service:   http://localhost:8000/docs
#   backend-java: http://localhost:8080/api/health  (admin/admin123)
#   web-console:  http://localhost:8088

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragenthub
      POSTGRES_PASSWORD: ragenthub
      POSTGRES_DB: ragenthub
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragenthub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  kafka:
    image: apache/kafka:3.7.2
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports: ["9092:9092"]

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://ragenthub:ragenthub@postgres:5432/ragenthub
      VECTOR_BACKEND: chroma
      RAGENTHUB_DATA_DIR: /data
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: sync
      KAFKA_BOOTSTRAP: kafka:9092
      HF_ENDPOINT: https://hf-mirror.com
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-llama3}
      # Access control: empty API_KEY = development mode, no authentication.
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CHAT_CONTEXT_TURNS: ${CHAT_CONTEXT_TURNS:-3}
      CHAT_CONTEXT_MAX_CHARS: ${CHAT_CONTEXT_MAX_CHARS:-500}
    ports: ["8000:8000"]
    volumes:
      # Chroma 向量库 + 业务数据持久化（容器重建不丢）
      - ai_data:/data
      # 本地 ONNX embedding 模型（只读挂载，容器离线可用）
      - ./all-MiniLM-L6-v2:/models/minilm:ro
      # ONNX 模型缓存（首次由 entrypoint 播种，之后复用）
      - onnx_cache:/root/.cache/chroma/onnx_models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  backend-java:
    build: ./backend-java
    environment:
      AI_SERVICE_BASE_URL: http://ai-service:8000
    ports: ["8080:8080"]
    depends_on:
      ai-service: { condition: service_healthy }

  web-console:
    build: ./web-console
    ports: ["8088:80"]
    depends_on:
      - ai-service

volumes:
  pg_data:
  ai_data:
  onnx_cache:
